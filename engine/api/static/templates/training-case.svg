<text fill="#263E4C" font-size="32.0" font-weight="400"><tspan x="536.0" y="210.0">观察事实：孩子三次调</tspan><tspan x="536.0" y="250.0">整积木位置，仍未搭稳</tspan><tspan x="536.0" y="290.0">。</tspan></text>
<text fill="#263E4C" font-size="32.0" font-weight="400"><tspan x="896.0" y="210.0">保留原话：“我想搭高</tspan><tspan x="896.0" y="250.0">一点，但是它总是倒下</tspan><tspan x="896.0" y="290.0">来。”</tspan></text>
<text fill="#263E4C" font-size="32.0" font-weight="400"><tspan x="536.0" y="433.0">共同讨论：哪些材料和</tspan><tspan x="536.0" y="473.0">提问能够支持孩子继续</tspan><tspan x="536.0" y="513.0">尝试？</tspan></text>
<text fill="#263E4C" font-size="32.0" font-weight="400"><tspan x="896.0" y="433.0">支持策略：补充不同形</tspan><tspan x="896.0" y="473.0">状的积木，观察儿童接</tspan><tspan x="896.0" y="513.0">下来的探索。</tspan></text>
