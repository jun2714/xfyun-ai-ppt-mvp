<text fill="#50372D" font-size="32.0" font-weight="400"><tspan x="48.0" y="210.0">明确问题：记录儿童在搭建中遇到的具体困难，</tspan><tspan x="48.0" y="250.0">选定本周持续观察的重点。</tspan></text>
<text fill="#50372D" font-size="32.0" font-weight="400"><tspan x="48.0" y="358.66666666666663">实施支持：补充不同形状的材料，用开放提问引</tspan><tspan x="48.0" y="398.66666666666663">导儿童尝试多种搭建方法。</tspan></text>
