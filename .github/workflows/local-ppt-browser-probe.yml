name: Local PPT Browser Probe

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Local PPT editor upload URL on the Windows runner
        required: true
        default: http://127.0.0.1:5001/upload
        type: string
      test_topic:
        description: Kindergarten topic used by the diagnostic run
        required: true
        default: 认识春天的小动物
        type: string
  push:
    branches:
      - main
    paths:
      - .github/ppt-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    name: Diagnose local PPT outline flow
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout diagnostics scripts
        uses: actions/checkout@v5

      - name: Refresh diagnostics code from latest main
        shell: powershell
        run: |
          git fetch origin main
          git checkout --force origin/main
          Write-Host "Diagnostics source: $(git rev-parse HEAD)"

      - name: Show runner and browser environment
        shell: powershell
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          node --version
          npm --version
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw "Microsoft Edge was not found on the runner." }
          Write-Host "Edge: $edge"

      - name: Verify engine and API are reachable
        shell: powershell
        run: |
          function Assert-ServiceResponds([string]$url) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 15
              Write-Host "$url -> $($response.StatusCode)"
            } catch {
              if ($_.Exception.Response) {
                Write-Host "$url -> HTTP $([int]$_.Exception.Response.StatusCode) (service reachable)"
                return
              }
              throw "$url is not reachable: $($_.Exception.Message)"
            }
          }
          Assert-ServiceResponds "http://127.0.0.1:5001/upload"
          Assert-ServiceResponds "http://127.0.0.1:8000/api/v1/ppt/kindergarten/planner/runtime"

      - name: Ensure outline web app is running
        shell: powershell
        run: |
          $webUrl = "http://127.0.0.1:5173/"
          try {
            $response = Invoke-WebRequest -UseBasicParsing -Uri $webUrl -TimeoutSec 5
            Write-Host "$webUrl already running -> $($response.StatusCode)"
            exit 0
          } catch {
            Write-Host "Outline web app is not running; starting a temporary Vite server for this probe."
          }

          npm install --prefix web --no-package-lock --no-audit --no-fund
          $process = Start-Process -FilePath "npm.cmd" -ArgumentList @("--prefix", "web", "run", "dev") -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          Write-Host "Started outline web app process PID=$($process.Id)"

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $webUrl -TimeoutSec 3
              Write-Host "$webUrl -> $($response.StatusCode)"
              $ready = $true
              break
            } catch {
              if ($process.HasExited) {
                throw "Outline web app exited before becoming ready (exit $($process.ExitCode))."
              }
            }
          }
          if (-not $ready) { throw "Outline web app did not become ready within 30 seconds." }

      - name: Install isolated Playwright runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .runtime\playwright | Out-Null
          npm install --prefix .runtime\playwright --no-package-lock --no-save playwright@1.55.0

      - name: Reproduce kindergarten outline generation
        shell: powershell
        env:
          TARGET_URL: ${{ inputs.target_url || 'http://127.0.0.1:5001/upload' }}
          TEST_TOPIC: ${{ inputs.test_topic || '认识春天的小动物' }}
          API_BASE_URL: http://127.0.0.1:8000/api/v1/ppt
        run: node scripts/local-outline-probe.mjs

      - name: Upload outline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ppt-outline-diagnostics
          path: .runtime/outline-probe
          if-no-files-found: warn
          retention-days: 7
